name: Local Modification Validation

on:
    push:
        branches:
            - main
        paths:
            - 'scripts/**'
            - '.github/workflows/**'
    pull_request:
        paths:
            - 'scripts/**'
            - '.github/workflows/**'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        name: Validate Modifications Against Upstream
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  path: current-repo

            - name: Get latest upstream version
              id: upstream_version
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  version=$(gh api repos/gitkraken/vscode-gitlens/releases/latest --jq '.tag_name')
                  if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
                      echo "::error::Could not resolve the latest upstream release (got '$version')."
                      exit 1
                  fi

                  echo "Latest upstream version: $version"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Fetch upstream release
              env:
                  VERSION: ${{ steps.upstream_version.outputs.version }}
              run: |
                  set -euo pipefail
                  git clone --depth 1 --branch "$VERSION" \
                      https://github.com/gitkraken/vscode-gitlens.git upstream-repo

            - name: Apply local modifications
              env:
                  VERSION: ${{ steps.upstream_version.outputs.version }}
              run: |
                  set -euo pipefail

                  echo "Applying local modifications to upstream $VERSION..."

                  # Exits non-zero with a `::error file=...::` annotation naming the rule and function that
                  # could no longer be located, so a stale rule is fixed before it reaches the build.
                  node current-repo/scripts/apply-patches.mjs \
                      --root upstream-repo \
                      --diff "$RUNNER_TEMP/local-changes.diff"

                  echo "✅ All local modifications applied to upstream $VERSION."

            - name: Verify the modifications are idempotent
              env:
                  VERSION: ${{ steps.upstream_version.outputs.version }}
              run: |
                  set -euo pipefail

                  # A second pass over an already-patched checkout must find every rule already applied
                  # and change nothing — otherwise re-running the workflow on a warm tree would corrupt it.
                  output=$(node current-repo/scripts/apply-patches.mjs --root upstream-repo --check)
                  echo "$output"

                  if ! grep -q "0 modified" <<< "$output"; then
                      echo "::error::Local modifications are not idempotent — a second pass still rewrote files."
                      exit 1
                  fi

                  echo "✅ Modifications are idempotent on upstream $VERSION."
