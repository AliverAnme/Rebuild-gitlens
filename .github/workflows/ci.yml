name: Local Modification Validation

on:
    push:
        branches:
            - main
        paths:
            - 'scripts/**'
            - '.github/workflows/**'
            - 'docs/**'
            - 'package.json'
    pull_request:
        paths:
            - 'scripts/**'
            - '.github/workflows/**'
            - 'docs/**'
            - 'package.json'
    schedule:
        # A second daily run, twelve hours away from the release build: upstream drift shows up here
        # as a failed validation instead of as a release that cannot be produced at 00:00.
        - cron: '0 12 * * *'
    workflow_dispatch:

permissions:
    contents: read

# A newer push or PR update supersedes the run in flight; only the release build serializes.
concurrency:
    group: validate-modifications-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        name: Codemod Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'

            - name: Run the tests
              # Hermetic: no network, no upstream checkout, no dependencies. Covers the scanning
              # primitives, the rules' anchors and markers, the CLI's counting invariants, and the
              # syntax of the guide's code blocks.
              run: node --test scripts/__tests__/*.test.mjs

    validate:
        name: Validate Modifications Against Upstream
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: current-repo
                  persist-credentials: false

            - name: Get latest upstream version
              id: upstream_version
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  version=$(gh api repos/gitkraken/vscode-gitlens/releases/latest --jq '.tag_name')
                  if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
                      echo "::error::Could not resolve the latest upstream release (got '$version')."
                      exit 1
                  fi

                  echo "Latest upstream version: $version"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Fetch upstream release
              env:
                  VERSION: ${{ steps.upstream_version.outputs.version }}
              run: |
                  set -euo pipefail
                  git clone --depth 1 --branch "$VERSION" \
                      https://github.com/gitkraken/vscode-gitlens.git upstream-repo

            - name: Apply local modifications
              env:
                  VERSION: ${{ steps.upstream_version.outputs.version }}
              run: |
                  set -euo pipefail

                  echo "Applying local modifications to upstream $VERSION..."

                  # --assert-fresh is the whole point of this job: a rule that reports "already applied"
                  # on a brand-new upstream checkout has given up silently, and this turns that into a
                  # red build instead of a release missing one of the local modifications.
                  node current-repo/scripts/apply-patches.mjs \
                      --root upstream-repo \
                      --expect-version "$VERSION" \
                      --assert-fresh \
                      --diff "$RUNNER_TEMP/local-changes.diff"

                  echo "✅ All local modifications applied to upstream $VERSION."

            - name: Verify the modifications are idempotent
              env:
                  VERSION: ${{ steps.upstream_version.outputs.version }}
              run: |
                  set -euo pipefail

                  # A second pass over an already-patched checkout must recognise every rule and change
                  # nothing — this asserts that in the exit code instead of grepping the human-readable
                  # summary, which is what the previous `grep "0 modified"` did.
                  node current-repo/scripts/apply-patches.mjs \
                      --root upstream-repo \
                      --check \
                      --assert-applied

                  echo "✅ Modifications are idempotent on upstream $VERSION."
