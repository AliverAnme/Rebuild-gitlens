name: Fix gitlens and build

on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:
        inputs:
            version:
                description: 'Release version (e.g., v17.8.1). Leave empty for latest'
                required: false
                type: string

permissions:
    contents: read

# Serialize sync runs. Two overlapping runs race on the release tag: one creates it while the
# other has already resolved "tag does not exist", and they would build the same version twice.
concurrency:
    group: sync-release
    cancel-in-progress: false

jobs:
    resolve:
        name: Resolve Version
        runs-on: ubuntu-latest
        # The default is 360 minutes; a stuck resolve would hold the sync group for hours.
        timeout-minutes: 10
        outputs:
            version: ${{ steps.resolve.outputs.version }}
            exists: ${{ steps.resolve.outputs.exists }}
        steps:
            - name: Resolve target version
              id: resolve
              env:
                  GH_TOKEN: ${{ github.token }}
                  INPUT_VERSION: ${{ github.event.inputs.version }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  version="$INPUT_VERSION"
                  if [[ -z "$version" ]]; then
                      echo "No version given, resolving the latest upstream release..."
                      version=$(gh api repos/gitkraken/vscode-gitlens/releases/latest --jq '.tag_name')
                  fi

                  # Anchored at both ends on purpose: an unanchored pattern would accept
                  # things like 'v19.4.0; rm -rf /' straight through validation.
                  if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
                      echo "::error::Could not resolve a valid target version (got '$version')."
                      exit 1
                  fi

                  echo "Resolved version: $version"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

                  # matching-refs answers 200 with an empty list when nothing matches, so an
                  # auth or rate-limit failure stays a hard error instead of looking like
                  # "tag not found" and sending us off to build a release that already exists.
                  refs=$(gh api "repos/$REPO/git/matching-refs/tags/$version" --jq '.[].ref')
                  if grep -qx "refs/tags/$version" <<< "$refs"; then
                      echo "Tag $version already exists in this repository."
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "Tag $version has not been built yet."
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

    sync-release:
        name: Sync Release
        needs: resolve
        if: needs.resolve.outputs.exists == 'false'
        runs-on: ubuntu-latest
        # Bundling GitLens takes a few minutes; an unbounded job would sit on a runner for the
        # default six hours if a build step hangs.
        timeout-minutes: 60
        permissions:
            contents: write
        env:
            VERSION: ${{ needs.resolve.outputs.version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # This repository is small, and a full clone keeps the upstream tag fetch below
                  # indistinguishable from a normal checkout, so leave the defaults in place.
                  fetch-tags: true
                  fetch-depth: 0
                  # This job holds contents:write, and the next steps run code fetched from
                  # elsewhere (upstream's build scripts) — keep the credential out of the worktree.
                  persist-credentials: false

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  # Upstream declares engines.node ">= 24"
                  node-version: '24'

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  # Upstream declares engines.pnpm ">= 11" and packageManager pnpm@11
                  version: '11'

            - name: Fetch upstream release
              run: |
                  set -euo pipefail
                  # The leading "+" is load-bearing. "Checkout code" runs with fetch-tags: true, so a
                  # tag of the same name may already exist locally, pointing at our own repo's
                  # commit. A non-forced refspec is then rejected outright with "would clobber
                  # existing tag" and this step dies with a misleading error.
                  git fetch https://github.com/gitkraken/vscode-gitlens.git \
                      "+refs/tags/$VERSION:refs/tags/$VERSION" --depth=1

            - name: Checkout upstream release
              run: |
                  set -euo pipefail
                  git checkout "$VERSION"

            - name: Fetch local modifications
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ github.repository }}
                  path: source-repo
                  sparse-checkout: |
                      scripts
                  sparse-checkout-cone-mode: false
                  persist-credentials: false

            - name: Stage the codemod
              run: |
                  set -euo pipefail
                  # Keep the codemod outside the upstream worktree: `pnpm package` would otherwise be
                  # able to see (and possibly package) it, and the steps below still need it after the
                  # checkout is removed.
                  cp -R source-repo/scripts "$RUNNER_TEMP/codemod"
                  rm -rf source-repo

            - name: Apply local modifications
              run: |
                  set -euo pipefail
                  # Structural rewrites keyed on function names, not on line numbers, so upstream
                  # refactors around a target no longer invalidate the build.
                  #
                  # --expect-version: build the version we resolved, not whatever the checkout happens
                  #                   to hold.
                  # --assert-fresh: every rule must be applied by *this* run. A rule whose "already
                  #                  applied" test matches upstream by accident is skipped silently,
                  #                  and this is what turns that into a failed build.
                  node "$RUNNER_TEMP/codemod/apply-patches.mjs" \
                      --root . \
                      --expect-version "$VERSION" \
                      --assert-fresh

                  echo "TOUCHED_FILES=$(node "$RUNNER_TEMP/codemod/apply-patches.mjs" --list-files | tr '\n' ' ')" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: pnpm install

            - name: Fix formatting with oxfmt
              run: |
                  set -euo pipefail
                  # The codemod already emits formatter-clean code, and the build's own `fmt:check`
                  # (build.mjs, run through `pnpm package`) would fail on anything that is not. This
                  # step is the belt to that pair of braces — the file list comes from the codemod, so
                  # adding a rule never leaves this step pointing at the wrong files.
                  if [[ -z "${TOUCHED_FILES// /}" ]]; then
                      echo "::error::no touched files were reported by the codemod"
                      exit 1
                  fi
                  pnpm exec oxfmt --write $TOUCHED_FILES

            - name: Export the applied diff
              run: |
                  set -euo pipefail
                  # Runs after the formatter, so the diff in the job summary is the diff that ships.
                  # --assert-applied also proves the formatter did not disturb any rule's marker —
                  # without it, a rewrite that oxfmt could erase would only be noticed after release.
                  node "$RUNNER_TEMP/codemod/apply-patches.mjs" \
                      --root . \
                      --diff "$RUNNER_TEMP/local-changes.diff" \
                      --assert-applied

            - name: Package extension
              run: pnpm package

            - name: Get package name
              run: |
                  set -euo pipefail
                  name=$(node -p "require('./package.json').name")
                  version=$(node -p "require('./package.json').version")
                  echo "PACKAGE_NAME=${name}-${version}.vsix" >> "$GITHUB_ENV"
                  echo "PACKAGE_VERSION=${version}" >> "$GITHUB_ENV"

            - name: Generate Checksum
              run: |
                  set -euo pipefail
                  sha256sum "$PACKAGE_NAME" > "$PACKAGE_NAME.sha256"

            - name: Extract release notes
              run: |
                  set -euo pipefail
                  notes="$RUNNER_TEMP/release-notes.md"
                  : > "$notes"

                  # Inlined instead of a third-party action: a missing section used to fail the whole
                  # job (no release at all, and every later run retried the same version), while a
                  # changelog that merely lags behind must not block a release.
                  if [[ -f CHANGELOG.md ]]; then
                      # `index($0, header) == 1` rather than a regex: "[19.4.0]" inside a pattern is a
                      # bracket expression that happily matches a different release's heading.
                      awk -v header="## [$PACKAGE_VERSION]" '
                          index($0, header) == 1 { capture = 1; next }
                          capture && /^## / { exit }
                          capture { print }
                      ' CHANGELOG.md > "$notes"
                  fi

                  if [[ ! -s "$notes" ]]; then
                      echo "::warning::CHANGELOG.md has no section for $PACKAGE_VERSION — publishing without release notes."
                      echo "GitLens $PACKAGE_VERSION" > "$notes"
                  fi

            - name: Create GitHub release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  tag_name: ${{ env.VERSION }}
                  name: GitLens ${{ env.PACKAGE_VERSION }}
                  body_path: ${{ runner.temp }}/release-notes.md
                  draft: false
                  prerelease: false
                  files: |
                      ./${{ env.PACKAGE_NAME }}
                      ./${{ env.PACKAGE_NAME }}.sha256

            - name: Verify the release carries both assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  # The release and the tag are created before its assets are uploaded. Without this
                  # check a half-created release fails the job but leaves the tag behind, and every
                  # later run skips the version as "already built".
                  assets=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
                  echo "$assets"

                  for expected in "$PACKAGE_NAME" "$PACKAGE_NAME.sha256"; do
                      if ! grep -qx "$expected" <<< "$assets"; then
                          echo "::error::release $VERSION is missing $expected"
                          exit 1
                      fi
                  done

            - name: Report failure
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  {
                      echo "## ❌ 构建失败"
                      echo ""
                      echo "上游版本: \`$VERSION\`"
                      echo ""
                      echo "常见原因:"
                      echo ""
                      echo "1. \`scripts/lib/rules.mjs\` 的某项改动找不到锚点 —— 上游重构了对应的函数,需要更新对应规则"
                      echo "2. 上游提高了工具链要求 —— 对照上游 \`package.json\` 的 \`engines\` 字段与工作流里的 Node / pnpm 版本"
                      echo "3. \`pnpm install\` 或 \`pnpm package\` 失败 —— 上游依赖或构建脚本有变动"
                      echo "4. 产物上传失败 —— Release 与 tag 已经建出来了但资产不全,见下面的重发步骤"
                      echo ""
                      echo "### 重新构建这个版本"
                      echo ""
                      echo "工作流遇到本仓库已存在的同名 tag 会整体跳过,所以要先删掉 tag 与 Release:"
                      echo ""
                      echo '```bash'
                      echo "gh release delete $VERSION --repo $GITHUB_REPOSITORY --cleanup-tag --yes"
                      echo "gh workflow run 'Fix gitlens and build' --repo $GITHUB_REPOSITORY -f version=$VERSION"
                      echo '```'
                      echo ""
                      echo "> 重发前后的文件名与版本号相同,已下载的用户只能靠 \`.sha256\` 分辨,必要时在 Release 说明里注明。"
                  } >> "$GITHUB_STEP_SUMMARY"
